apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-workload-007
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/steadyphase/example-gitops.git'
    targetRevision: HEAD
    path: workloads/ai-workload-007
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-workloads
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true