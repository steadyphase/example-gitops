apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-inference
  namespace: ai-workloads
spec:
  replicas: 1
  strategy:
    type: Recreate # Required for ReadWriteOnce PVC
  selector:
    matchLabels:
      app: qwen-inference
  template:
    metadata:
      labels:
        app: qwen-inference
    spec:
      initContainers:
        - name: fetch-model
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              if [ ! -f /models/qwen2.5-1.5b-instruct-q4_k_m.gguf ]; then
                echo "Downloading Qwen2.5-1.5B-Instruct Q4_K_M..."
                curl -L -o /models/qwen2.5-1.5b-instruct-q4_k_m.gguf \
                  https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
              else
                echo "Model already cached on PVC."
              fi
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - --model
            - /models/qwen2.5-1.5b-instruct-q4_k_m.gguf
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --ctx-size
            - "4096"
            - --parallel
            - "4"
            - --cont-batching
            - --threads
            - "4"
            - --metrics
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "2000m"
              memory: "3Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llm-weights-pvc