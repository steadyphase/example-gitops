apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.fullnameOverride }}-weights-pvc
  labels:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.model.storageClassName }}
  storageClassName: {{ .Values.model.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.model.storageSize }}