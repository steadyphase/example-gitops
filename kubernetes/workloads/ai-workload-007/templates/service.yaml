apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.fullnameOverride }}-svc
  labels:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}
  ports:
    - name: http
      port: {{ .Values.inference.port }}
      targetPort: http