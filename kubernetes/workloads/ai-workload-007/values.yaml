fullnameOverride: "qwen-llm"

model:
  name: "qwen2.5"
  filename: "qwen2.5-1.5b-instruct-q4_k_m.gguf"
  url: "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
  storageSize: "5Gi"
  storageClassName: "" # Leave empty to use cluster default StorageClass

inference:
  image:
    repository: ghcr.io/ggml-org/llama.cpp
    tag: server
    pullPolicy: IfNotPresent
  initImage:
    repository: curlimages/curl
    tag: "8.10.1"
  port: 8080
  ctxSize: 4096
  parallelSlots: 4
  threads: 4
  resources:
    requests:
      cpu: "2000m"
      memory: "3Gi"
    limits:
      cpu: "4000m"
      memory: "4Gi"

benchmark:
  enabled: false
  runId: "run-01" # Increment (e.g., run-02) to trigger a fresh benchmark Job via GitOps
  image: "grafana/k6:0.54.0"
  iterationsPerVu: 15
  maxTokens: 128